name: Build latest TurboQuant daily for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag exacto de TheTom; dejar vacío para usar el último daily"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-windows-cuda:
    name: Windows x64 CUDA 12.4 RTX 3060
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Descargar repositorio de TheTom
        uses: actions/checkout@v6
        with:
          repository: TheTom/llama-cpp-turboquant
          fetch-depth: 0
          path: source

      - name: Seleccionar tag daily
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          Set-Location source

          git fetch --tags --force

          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
              $tags = @(
                  git tag `
                    --list "feature-turboquant-kv-cache-b*" `
                    --sort=-version:refname
              )

              if ($tags.Count -eq 0) {
                  throw "No se encontraron tags daily de TurboQuant."
              }

              $tag = $tags[0].Trim()
          }
          else {
              $tag = $env:REQUESTED_TAG.Trim()

              git rev-parse "refs/tags/$tag" 2>$null

              if ($LASTEXITCODE -ne 0) {
                  throw "El tag solicitado no existe: $tag"
              }
          }

          Write-Host "Tag seleccionado: $tag"

          git checkout --detach "refs/tags/$tag"

          $commit = (git rev-parse --short HEAD).Trim()

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Instalar CUDA Toolkit 12.4
        uses: ./source/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"

      - name: Instalar Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

      - name: Configurar y compilar llama-server
        shell: cmd
        working-directory: source
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_CUDA_ARCHITECTURES=86-real ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            -j %NINJA_JOBS%

      - name: Preparar paquete portable
        shell: pwsh
        env:
          BUILD_TAG: ${{ steps.version.outputs.tag }}
          BUILD_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          $sourceBin = Join-Path $env:GITHUB_WORKSPACE "source\build\bin\Release"
          $package = Join-Path $env:GITHUB_WORKSPACE "package"

          if (-not (Test-Path "$sourceBin\llama-server.exe")) {
              throw "No se encontró llama-server.exe después de compilar."
          }

          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "$sourceBin\*" $package -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\source\LICENSE" $package -Force

          $cudaPatterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $cudaPatterns) {
              $files = Get-ChildItem `
                  -Path "$env:CUDA_PATH\bin" `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              foreach ($file in $files) {
                  Copy-Item $file.FullName $package -Force
              }
          }

          @"
          Source: https://github.com/TheTom/llama-cpp-turboquant
          Tag: $env:BUILD_TAG
          Commit: $env:BUILD_COMMIT
          CUDA: 12.4
          Architecture: NVIDIA sm_86 / RTX 3060
          Build date UTC: $([DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss"))
          "@ | Set-Content "$package\BUILD-INFO.txt"

          Write-Host "Contenido del paquete:"
          Get-ChildItem $package | Select-Object Name, Length

      - name: Validar paquete
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"

          $requiredFiles = @(
              "llama-server.exe",
              "llama.dll",
              "llama-server-impl.dll",
              "llama-common.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll",
              "cudart64_12.dll",
              "cublas64_12.dll",
              "cublasLt64_12.dll",
              "LICENSE",
              "BUILD-INFO.txt"
          )

          foreach ($file in $requiredFiles) {
              $path = Join-Path $package $file

              if (-not (Test-Path $path)) {
                  throw "Falta un archivo requerido: $file"
              }

              if ((Get-Item $path).Length -eq 0) {
                  throw "El archivo está vacío: $file"
              }

              Write-Host "OK: $file"
          }

          $serverPath = Join-Path $package "llama-server.exe"
          $hash = Get-FileHash -Path $serverPath -Algorithm SHA256

          Write-Host ""
          Write-Host "llama-server.exe SHA256:"
          Write-Host $hash.Hash
          Write-Host ""
          Write-Host "Paquete validado correctamente."

      - name: Subir compilación
        uses: actions/upload-artifact@v6
        with:
          name: turboquant-${{ steps.version.outputs.tag }}-windows-x64-cuda12.4-sm86
          path: package
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
